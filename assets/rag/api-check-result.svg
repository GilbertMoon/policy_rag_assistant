<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#f7faff"/>
<rect x="0" y="0" width="1440" height="18" fill="#1769e0"/>
<text x="720" y="78" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="50" font-weight="800" fill="#10213f" text-anchor="middle"><tspan x="720" dy="0">API 서버와 셀프 채점</tspan></text>
<text x="720" y="122" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="600" fill="#5a6b81" text-anchor="middle"><tspan x="720" dy="0">코드 내부뿐 아니라 실제 POST /ask API까지 같은 결과가 나오는지 확인합니다</tspan></text>
<rect x="70" y="190" width="390" height="510" rx="24" fill="#ffffff" stroke="#d7e2f0" stroke-width="2"/>
<rect x="70" y="190" width="390" height="58" rx="24" fill="#1769e0"/>
<text x="265" y="229" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="265" dy="0">1. API 서버</tspan></text>
<text x="98" y="286" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" fill="#25334a" text-anchor="start"><tspan x="98" dy="0">uvicorn app:app</tspan><tspan x="98" dy="32">--host 0.0.0.0</tspan><tspan x="98" dy="32">--port 8000</tspan><tspan x="98" dy="32"></tspan><tspan x="98" dy="32">/health</tspan><tspan x="98" dy="32">→ ok: true</tspan><tspan x="98" dy="32"></tspan><tspan x="98" dy="32">/ask</tspan><tspan x="98" dy="32">→ JSON 응답</tspan></text><line x1="480" y1="435" x2="550" y2="435" stroke="#7f93aa" stroke-width="5"/>
<polygon points="550,435 534,425 534,445" fill="#7f93aa"/><rect x="570" y="190" width="390" height="510" rx="24" fill="#ffffff" stroke="#d7e2f0" stroke-width="2"/>
<rect x="570" y="190" width="390" height="58" rx="24" fill="#0f8ca8"/>
<text x="765" y="229" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="765" dy="0">2. check.py</tspan></text>
<text x="598" y="286" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" fill="#25334a" text-anchor="start"><tspan x="598" dy="0">python -X utf8 check.py</tspan><tspan x="598" dy="32">--url http://127.0.0.1:8000/ask</tspan><tspan x="598" dy="32"></tspan><tspan x="598" dy="32">S1~M3 근거 정확도</tspan><tspan x="598" dy="32">T1~T2 함정 문항</tspan><tspan x="598" dy="32"></tspan><tspan x="598" dy="32">형식·속도·근거를</tspan><tspan x="598" dy="32">함께 점검</tspan></text><line x1="980" y1="435" x2="1050" y2="435" stroke="#7f93aa" stroke-width="5"/>
<polygon points="1050,435 1034,425 1034,445" fill="#7f93aa"/><rect x="1070" y="190" width="300" height="510" rx="24" fill="#ffffff" stroke="#d7e2f0" stroke-width="2"/>
<rect x="1070" y="190" width="300" height="58" rx="24" fill="#158553"/>
<text x="1220" y="229" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1220" dy="0">3. 최종 결과</tspan></text>
<text x="1098" y="286" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" fill="#25334a" text-anchor="start"><tspan x="1098" dy="0">일반 문항 평균</tspan><tspan x="1098" dy="32">1.00</tspan><tspan x="1098" dy="32"></tspan><tspan x="1098" dy="32">함정 문항</tspan><tspan x="1098" dy="32">100%</tspan><tspan x="1098" dy="32"></tspan><tspan x="1098" dy="32">API 기준</tspan><tspan x="1098" dy="32">회귀 테스트 PASS</tspan></text>
</svg>