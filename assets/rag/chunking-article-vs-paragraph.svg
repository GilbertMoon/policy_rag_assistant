<text x="720" y="122" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="600" fill="#5a6b81" text-anchor="middle"><tspan x="720" dy="0">근거를 얼마나 세밀하게 나눌지에 따라 검색과 citation 정확도가 달라집니다</tspan></text>
