<text x="798" y="286" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" fill="#25334a" text-anchor="start"><tspan x="798" dy="0">Chunk 1 = 제7조 제1항</tspan><tspan x="798" dy="32">Chunk 2 = 제7조 제2항</tspan><tspan x="798" dy="32">Chunk 3 = 제7조 제3항</tspan><tspan x="798" dy="32"></tspan><tspan x="798" dy="32">장점: citation이 정확함</tspan><tspan x="798" dy="32">검색 결과 해석이 쉬움</tspan><tspan x="798" dy="32"></tspan><tspan x="798" dy="32">이번 실습 기본값: paragraph</tspan></text><rect x="205" y="730" width="1030" height="78" rx="20" fill="#eaf2ff"/>
  <text x="720" y="780" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="28" font-weight="800" fill="#174f9e" text-anchor="middle"><tspan x="720" dy="0">이번 기준선: 항 단위 528개 Chunk</tspan></text>
