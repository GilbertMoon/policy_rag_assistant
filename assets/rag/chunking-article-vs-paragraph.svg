<text x="108" y="286" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" fill="#25334a" text-anchor="start"><tspan x="108" dy="0">제7조 전체</tspan><tspan x="108" dy="32"></tspan><tspan x="108" dy="32">① 장애인 감면 …</tspan><tspan x="108" dy="32">② 다른 감면 …</tspan><tspan x="108" dy="32">③ 둘 이상의 감면사유 …</tspan><tspan x="108" dy="32"></tspan><tspan x="108" dy="32">장점: 문맥이 넓음</tspan><tspan x="108" dy="32">단점: 근거가 뭉뚱그려짐</tspan></text><rect x="770" y="190" width="590" height="500" rx="24" fill="#ffffff" stroke="#d7e2f0" stroke-width="2"/>
<rect x="770" y="190" width="590" height="58" rx="24" fill="#1769e0"/>
