<text x="1038" y="296" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" fill="#25334a" text-anchor="start"><tspan x="1038" dy="0">필요한 값 추출</tspan><tspan x="1038" dy="32">3개 급지 × 6개 값</tspan><tspan x="1038" dy="32">= 18개 값</tspan><tspan x="1038" dy="32"></tspan><tspan x="1038" dy="32">필요한 정보만</tspan><tspan x="1038" dy="32">구조화</tspan></text><rect x="220" y="690" width="1000" height="92" rx="22" fill="#edf8f2"/>
  <text x="720" y="748" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="25" font-weight="800" fill="#147946" text-anchor="middle"><tspan x="720" dy="0">핵심: Studio에서는 ‘문서를 어떻게 읽고, 무엇을 뽑을지’를 눈으로 확인합니다.</tspan></text>
