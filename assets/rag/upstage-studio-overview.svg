<text x="573" y="296" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" fill="#25334a" text-anchor="start"><tspan x="573" dy="0">문서 구조 읽기</tspan><tspan x="573" dy="32">표의 행·열 복원</tspan><tspan x="573" dy="32">Markdown / HTML</tspan><tspan x="573" dy="32"></tspan><tspan x="573" dy="32">문서를</tspan><tspan x="573" dy="32">읽는 단계</tspan></text><line x1="915" y1="415" x2="990" y2="415" stroke="#7f93aa" stroke-width="5"/>
