<text x="720" y="122" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="600" fill="#5a6b81" text-anchor="middle"><tspan x="720" dy="0">코드를 실행하기 전에 Parse → Extract 흐름을 직접 확인합니다</tspan></text>
