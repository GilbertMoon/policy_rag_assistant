<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#f7faff"/>
<rect x="0" y="0" width="1440" height="18" fill="#1769e0"/>
<text x="720" y="78" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="50" font-weight="800" fill="#10213f" text-anchor="middle"><tspan x="720" dy="0">Grace로 Parse / Extract Agent 만들기</tspan></text>
<text x="720" y="122" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="600" fill="#5a6b81" text-anchor="middle"><tspan x="720" dy="0">자연어로 원하는 작업을 설명하고 Agent 구조를 확인합니다</tspan></text>
<rect x="70" y="190" width="400" height="500" rx="24" fill="#ffffff" stroke="#d7e2f0" stroke-width="2"/>
<rect x="70" y="190" width="400" height="58" rx="24" fill="#8a5bd5"/>
<text x="270" y="229" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="270" dy="0">Grace에게 요청</tspan></text>
<text x="98" y="286" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" fill="#25334a" text-anchor="start"><tspan x="98" dy="0">“별표 1 주차요금표에서</tspan><tspan x="98" dy="32">1·2·3급지별 6개 값을</tspan><tspan x="98" dy="32">정수로 추출해 줘.</tspan><tspan x="98" dy="32">없는 값은 null로.”</tspan><tspan x="98" dy="32"></tspan><tspan x="98" dy="32">→ 요구사항을</tspan><tspan x="98" dy="32">자연어로 설명</tspan></text><line x1="490" y1="430" x2="565" y2="430" stroke="#7f93aa" stroke-width="5"/>
<polygon points="565,430 549,420 549,440" fill="#7f93aa"/><rect x="585" y="190" width="330" height="500" rx="24" fill="#ffffff" stroke="#d7e2f0" stroke-width="2"/>
<rect x="585" y="190" width="330" height="58" rx="24" fill="#0f8ca8"/>
<text x="750" y="229" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="750" dy="0">Parse</tspan></text>
<text x="613" y="286" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" fill="#25334a" text-anchor="start"><tspan x="613" dy="0">문서 읽기</tspan><tspan x="613" dy="32">표 구조 복원</tspan><tspan x="613" dy="32">행·열 유지</tspan><tspan x="613" dy="32"></tspan><tspan x="613" dy="32">입력 문서</tspan><tspan x="613" dy="32">→ 구조화된 내용</tspan></text><line x1="935" y1="430" x2="1010" y2="430" stroke="#7f93aa" stroke-width="5"/>
<polygon points="1010,430 994,420 994,440" fill="#7f93aa"/><rect x="1030" y="190" width="330" height="500" rx="24" fill="#ffffff" stroke="#d7e2f0" stroke-width="2"/>
<rect x="1030" y="190" width="330" height="58" rx="24" fill="#158553"/>
<text x="1195" y="229" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1195" dy="0">Extract</tspan></text>
<text x="1058" y="286" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" fill="#25334a" text-anchor="start"><tspan x="1058" dy="0">18개 값 추출</tspan><tspan x="1058" dy="32">notes 배열</tspan><tspan x="1058" dy="32">누락은 null</tspan><tspan x="1058" dy="32"></tspan><tspan x="1058" dy="32">구조화된 내용</tspan><tspan x="1058" dy="32">→ JSON 결과</tspan></text>
</svg>