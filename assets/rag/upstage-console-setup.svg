<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<rect width="1440" height="900" fill="#f7faff"/>
<rect x="0" y="0" width="1440" height="18" fill="#1769e0"/>
<text x="720" y="78" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="50" font-weight="800" fill="#10213f" text-anchor="middle"><tspan x="720" dy="0">Upstage Console 준비</tspan></text>
<text x="720" y="122" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="23" font-weight="600" fill="#5a6b81" text-anchor="middle"><tspan x="720" dy="0">API Key와 크레딧을 안전하게 준비합니다</tspan></text>
<rect x="80" y="190" width="590" height="520" rx="24" fill="#ffffff" stroke="#d7e2f0" stroke-width="2"/>
<rect x="80" y="190" width="590" height="58" rx="24" fill="#1769e0"/>
<text x="375" y="229" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="375" dy="0">1. API Key 발급</tspan></text>
<text x="108" y="286" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" fill="#25334a" text-anchor="start"><tspan x="108" dy="0">Upstage Console 로그인</tspan><tspan x="108" dy="32">→ API Keys 메뉴 이동</tspan><tspan x="108" dy="32">→ 새 Key 발급</tspan><tspan x="108" dy="32">→ .env에만 저장</tspan><tspan x="108" dy="32"></tspan><tspan x="108" dy="32">중요:</tspan><tspan x="108" dy="32">실제 Key는 코드·GitHub·화면 캡처에</tspan><tspan x="108" dy="32">노출하지 않습니다.</tspan></text><rect x="770" y="190" width="590" height="520" rx="24" fill="#ffffff" stroke="#d7e2f0" stroke-width="2"/>
<rect x="770" y="190" width="590" height="58" rx="24" fill="#8a5bd5"/>
<text x="1065" y="229" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1065" dy="0">2. 크레딧 확인</tspan></text>
<text x="798" y="286" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="600" fill="#25334a" text-anchor="start"><tspan x="798" dy="0">Billing / Credits 메뉴 확인</tspan><tspan x="798" dy="32">→ 교육용 쿠폰이 있으면 등록</tspan><tspan x="798" dy="32">→ 사용 가능 크레딧 확인</tspan><tspan x="798" dy="32"></tspan><tspan x="798" dy="32">정상 기준:</tspan><tspan x="798" dy="32">API 호출 전에 잔여 크레딧과</tspan><tspan x="798" dy="32">과금 상태를 확인합니다.</tspan></text><rect x="140" y="748" width="1160" height="76" rx="20" fill="#eaf2ff"/>
  <text x="720" y="797" font-family="Pretendard,Noto Sans KR,Arial,sans-serif" font-size="25" font-weight="800" fill="#174f9e" text-anchor="middle"><tspan x="720" dy="0">API Key는 비밀번호입니다. 공유·캡처·커밋하지 않습니다.</tspan></text>
</svg>